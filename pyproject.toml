[project]
name = "talkie-backtest"
version = "0.0.1"
description = "Backtest: does knowing source track records improve a vintage model's forecasts of 1931-1940?"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pyyaml",
  "tiktoken>=0.6",
  "fastapi",
  "pydantic>=2",
  "httpx",
  "modal[api-proxy-support]>=1.0",
]

[project.optional-dependencies]
model = ["torch>=2.4", "transformers>=4.56", "huggingface_hub", "safetensors"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["firewall", "budget"]

[tool.setuptools.packages.find]
include = ["serve*", "forecaster*", "controls*", "analysis*", "archive*", "ledger*", "librarian*", "questions*"]
