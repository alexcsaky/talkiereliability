# Anachronism lexicon for firewall.py.
#
# Each entry is a phrase that should not appear in text written before 1931.
# A hit rejects the string outright. Keep entries to terms that were coined or
# took this meaning after 1930. Words that existed before 1931 (Hitler, Nazi,
# television, Anschluss, "great depression" in lower case, "atomic bomb" as in
# H. G. Wells) are NOT listed: they would reject genuine period text. Those
# belong to the leak probes, not the firewall.
#
# case: "sensitive" matches the capitalisation given; "insensitive" ignores it.
# Matching is on word boundaries after whitespace is collapsed.
#
# Review status: drafted by Claude on 20 Nov 2026 (hypothesis). Alex to review
# before stage 1. Stage 1 adds a data-driven list: n-grams frequent in American
# Stories after 1935 and absent before 1931 (see docs/DECISIONS.md).

terms:
  # Wars and international order
  - {text: "World War II", case: insensitive}
  - {text: "World War 2", case: insensitive}
  - {text: "WWII", case: insensitive}
  - {text: "World War I", case: sensitive}        # numbering implies a second
  - {text: "WWI", case: insensitive}
  - {text: "Second World War", case: sensitive}   # capitalised as a name only
  - {text: "First World War", case: sensitive}    # name implies a second
  - {text: "United Nations Organization", case: insensitive}
  - {text: "UN Security Council", case: insensitive}
  - {text: "Security Council", case: sensitive}
  - {text: "Cold War", case: sensitive}
  - {text: "Iron Curtain", case: sensitive}
  - {text: "Pearl Harbor attack", case: insensitive}
  - {text: "attack on Pearl Harbor", case: insensitive}
  - {text: "Nazi Germany", case: insensitive}
  - {text: "Gestapo", case: insensitive}
  - {text: "Kristallnacht", case: insensitive}
  - {text: "Munich Agreement", case: insensitive}
  - {text: "Lend-Lease", case: insensitive}
  - {text: "Manhattan Project", case: insensitive}
  - {text: "Nuremberg trials", case: insensitive}
  - {text: "Marshall Plan", case: insensitive}
  - {text: "NATO", case: sensitive}
  - {text: "Axis powers", case: insensitive}
  - {text: "Blitzkrieg", case: insensitive}
  - {text: "Manchukuo", case: insensitive}
  - {text: "Spanish Civil War", case: insensitive}
  - {text: "Italo-Ethiopian War", case: insensitive}
  - {text: "Holocaust", case: sensitive}          # capitalised as a name only
  # American politics of the 1930s
  - {text: "New Deal", case: sensitive}
  - {text: "Social Security Act", case: insensitive}
  - {text: "Tennessee Valley Authority", case: insensitive}
  - {text: "Works Progress Administration", case: insensitive}
  - {text: "Civilian Conservation Corps", case: insensitive}
  - {text: "Dust Bowl", case: insensitive}
  - {text: "the Great Depression", case: sensitive}
  - {text: "FDR", case: sensitive}
  # Technology and later coinages
  - {text: "radar", case: insensitive}
  - {text: "nylon", case: insensitive}
  - {text: "atom bomb", case: insensitive}
  - {text: "nuclear weapon", case: insensitive}
  - {text: "nuclear weapons", case: insensitive}
  - {text: "jet engine", case: insensitive}
  - {text: "transistor", case: insensitive}
  - {text: "computer program", case: insensitive}
  - {text: "internet", case: insensitive}
  - {text: "website", case: insensitive}
  - {text: "e-mail", case: insensitive}
  - {text: "email", case: insensitive}
  - {text: "smartphone", case: insensitive}
  - {text: "Wikipedia", case: insensitive}
  - {text: "Wikidata", case: insensitive}
  - {text: "teenager", case: insensitive}
  - {text: "Superman", case: sensitive}
  # Retrospective framings of the target decade
  - {text: "the 1930s", case: insensitive}
  - {text: "the thirties", case: insensitive}
  - {text: "interwar", case: insensitive}
  - {text: "inter-war", case: insensitive}
  - {text: "postwar era", case: insensitive}

# Modern matter: patterns removed by clean_text() before checks.
# These are regexes; they are stripped, not rejected.
strip_patterns:
  - "https?://\\S+"
  - "www\\.\\S+"
  - "\\S+@\\S+\\.(?:com|org|net|edu|gov)\\b"
  - "(?i)digiti[sz]ed by [A-Z][\\w ]{0,40}"
  - "(?i)Library of Congress,? Chronicling America"
  - "(?i)\\bISBN[\\s:-]*[\\dX-]{10,17}"
  - "(?i)\\bQ\\d{2,9}\\b"   # Wikidata ids
